worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;

    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Upgrade helper for WebSocket etc.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- ORIGIN over HTTP :80 (no SSL here) ----------
    server {
        listen 80;
        server_name zurtexbackend569827.xyz;

        # Root → local :5002
        location / {
            proxy_pass http://127.0.0.1:5002;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_cache_bypass                 $http_upgrade;
        }

        # Main backend on /main
        location /main/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_cache_bypass                 $http_upgrade;
        }

        # Melli backend on /melli
        location /melli/ {
            proxy_pass http://127.0.0.1:5001/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_cache_bypass                 $http_upgrade;
        }

        # Tasket backend on /tasket (→ :5003)
        location = /tasket {
            return 301 $scheme://$host/tasket/;
        }

        location /tasket/ {
            proxy_pass http://127.0.0.1:5003/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_cache_bypass                 $http_upgrade;
        }

        # Payment backend on /payment (→ :5004)
        location = /payment {
            return 301 $scheme://$host/payment/;
        }

        location /payment/ {
            proxy_pass http://127.0.0.1:5004/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_cache_bypass                 $http_upgrade;
        }
    }

    # ---------- OpenMusic Website over HTTP :80 ----------
    server {
        listen 80;
        server_name openmusic.website www.openmusic.website;

        root C:/Projects/OpenMusic/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ---------- OpenMusic Website over HTTPS :443 ----------
    # Commented out - GCore CDN handles SSL termination
    # Uncomment and add SSL certs if needed locally
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name openmusic.website www.openmusic.website;
    #
    #     root C:/Projects/OpenMusic/dist;
    #     index index.html;
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    #
    #     # GCore manages SSL certificates
    # }
}
